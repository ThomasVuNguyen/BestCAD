name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: cd web && pnpm install
      - run: cd web && pnpm typecheck
      - run: cd web && pnpm lint

  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install OCCT system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libtcl8.6-dev libtk8.6-dev libfreetype-dev libxi-dev libxmu-dev libgl-dev
      - name: Cache OCCT Build
        id: cache-occt
        uses: actions/cache@v4
        with:
          path: /usr/local/occt
          key: ${{ runner.os }}-occt-V8_0_1
      - name: Build OCCT
        if: steps.cache-occt.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch V8_0_1 https://github.com/Open-Cascade-SAS/OCCT.git /tmp/OCCT
          cd /tmp/OCCT
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DBUILD_MODULE_Draw=OFF -DBUILD_MODULE_Visualization=OFF -DBUILD_DOC_Overview=OFF -DUSE_TBB=OFF -DUSE_FREEIMAGE=OFF -DUSE_VTK=OFF -DCMAKE_INSTALL_PREFIX=/usr/local/occt
          make -j$(nproc)
          sudo make install
      - name: Rust fmt
        run: cargo fmt --check
      - name: Rust clippy
        env:
          OCCT_ROOT: /usr/local/occt
          LD_LIBRARY_PATH: /usr/local/occt/lib
        run: cargo clippy -- -D warnings
      - name: Rust tests
        env:
          OCCT_ROOT: /usr/local/occt
          LD_LIBRARY_PATH: /usr/local/occt/lib
        run: cargo test

  build-container:
    needs: [lint-and-typecheck, rust-checks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  e2e:
    needs: build-container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - name: Install e2e deps
        run: cd e2e && pnpm install
      - name: Install Playwright Browsers
        run: cd e2e && pnpm exec playwright install --with-deps
      - name: Build and run container locally for e2e
        run: |
          docker build -t bestcad:local .
          docker run -d -p 3001:3001 --name bestcad-app bestcad:local
          sleep 5
      - name: Run Playwright tests
        run: cd e2e && pnpm exec playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30
